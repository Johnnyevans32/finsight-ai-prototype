version: '3.8'

services:
  # Start with just the essential services
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/db.sqlite3:/app/db.sqlite3
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    networks:
      - finsight_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finsight_network

networks:
  finsight_network:
    driver: bridge

volumes:
  sqlite_data: