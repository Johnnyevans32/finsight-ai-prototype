services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
    restart: unless-stopped
    networks:
      - finsight_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finsight_network

networks:
  finsight_network:
    driver: bridge

volumes:
  sqlite_data: